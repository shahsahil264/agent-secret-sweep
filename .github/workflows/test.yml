name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pytest-cov
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: pytest tests/ -q --cov=skills/agent-secret-sweep/scripts

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The scanner must find nothing in its own source
        run: python3 skills/agent-secret-sweep/scripts/scan.py . --depth 6
